name: Pip-Audit

on:
  push:
  pull_request:
  schedule:
    - cron: '0 5 * * 1,5'  # every Monday and Friday at 05:00 UTC

# Least privilege: read-only token, no write access, and no secrets are
# referenced. Publishing/write access lives only in release.yml.
permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install Poetry Export Plugin
        run: poetry self add poetry-plugin-export

      - name: Export requirements.txt
        run: poetry export -f requirements.txt --output requirements.txt --without-hashes

      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
