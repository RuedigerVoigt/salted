# This workflow runs Unit-Tests for salted on Windows with the oldest and
# latest stable Python versions, plus the upcoming Python 3.15.


name: Windows Test

on: [push, pull_request]

# Least privilege: read-only token, no write access, and no secrets are
# referenced. Publishing/write access lives only in release.yml.
permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        # 3.15 is a regular entry: a failure there fails CI like any other.
        python-version: ['3.11', '3.14', '3.15']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install -r .github/requirements/poetry.txt

    - name: Install dependencies
      run: |
        poetry install --with test

    - name: Compile to bytecode
      run: python -m compileall salted/

    - name: Test with pytest
      run: |
        poetry run pytest
