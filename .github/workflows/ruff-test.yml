# This workflow runs ruff linting checks
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Ruff

on: [push, pull_request]

# Least privilege: read-only token, no write access, and no secrets are
# referenced. Publishing/write access lives only in release.yml.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: APT Update
      run: sudo apt update

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry

    - name: Install dependencies
      run: |
        poetry install --with dev

    - name: Lint with ruff
      # This job is check-only: it must never modify files in the repo.
      # Do NOT add `--fix` or run `ruff format`/`--write` here; auto-fixing
      # is a local developer step, never CI.
      run: |
        # Lint the library only; the test suite is exercised by the test
        # workflows, so tests/ is intentionally not linted here.
        # stop the build if there are Python syntax errors or undefined names
        poetry run ruff check salted/ --select=E9,F63,F7,F82 --statistics
        # exit-zero treats all errors as warnings (rules from pyproject.toml)
        poetry run ruff check salted/ --exit-zero --statistics
