name: Release / Publish to PyPI

on:
  release:
    types: [published]

# Two jobs, so that no third-party Python code runs where the PyPI token can
# be minted: `build` runs the build tools with a read-only token, `publish`
# holds id-token: write but only uploads the files `build` produced.
permissions: {}

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    if: github.event.release.target_commitish == 'main'
    permissions:
      contents: read  # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      # Pinned and hash-checked. --no-isolation builds with exactly these
      # packages; build isolation would fetch poetry-core unpinned.
      - name: Install build tools
        run: python -m pip install --require-hashes --no-deps -r .github/requirements/release.txt

      - name: Build package
        run: python -m build --no-isolation

      - name: Store the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: upload release to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Specifying a GitHub environment is optional, but strongly encouraged
    environment: pypi
    permissions:
      id-token: write      # trusted publishing: mint the PyPI upload token
      attestations: write  # attestations published with the distributions
    steps:
      - name: Retrieve the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Runs `twine check` on the files before uploading them
      # (verify-metadata defaults to true).
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
