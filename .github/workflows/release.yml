name: Release / Publish to PyPI

on:
  release:
    types: [published]

# Two jobs, so that no third-party Python code runs where the PyPI token can
# be minted: `build` runs the build tools with a read-only token, `publish`
# holds id-token: write but only uploads the files `build` produced.
permissions: {}

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    if: github.event.release.target_commitish == 'main'
    permissions:
      contents: read  # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # Pinned and hash-checked. --no-isolation builds with exactly these
      # packages; build isolation would fetch poetry-core unpinned.
      - name: Install build tools
        run: python -m pip install --require-hashes --no-deps -r .github/requirements/release.txt

      - name: Build package
        run: python -m build --no-isolation

      - name: Store the distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: upload release to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Specifying a GitHub environment is optional, but strongly encouraged
    environment: pypi
    permissions:
      id-token: write      # trusted publishing: mint the PyPI upload token
      attestations: write  # attestations published with the distributions
    steps:
      - name: Retrieve the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Runs `twine check` on the files before uploading them
      # (verify-metadata defaults to true).
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
