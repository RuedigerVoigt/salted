 # The code has type annotations. Enforce correctness of those.

name: Mypy

on: [push, pull_request]

# Least privilege: read-only token, no write access, and no secrets are
# referenced. Publishing/write access lives only in release.yml.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.11', '3.14']
    steps:

    - name: APT Update
      run: sudo apt update

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install -r .github/requirements/poetry.txt

    - name: Install dependencies
      run: |
        poetry install --with dev

    - name: Check code with Mypy
      run: poetry run mypy salted/
