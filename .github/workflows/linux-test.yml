# This workflow will install Python dependencies and run tests with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Linux Test

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # Deliberately test the oldest and newest supported versions plus one
        # in between. Intermediate releases (3.11, 3.12) are skipped on purpose
        # to keep CI fast — salted is pure-Python with no version-specific code
        # paths, so boundary coverage is sufficient. (Windows/macOS workflows
        # narrow this further to oldest+newest / newest only.)
        python-version: ['3.10', '3.13', '3.14']

    steps:
    - name: APT Update
      run: sudo apt update

    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry

    - name: Install dependencies
      run: |
        poetry install --with test

    - name: Compile to bytecode
      run: python -m compileall salted/

    - name: Test with pytest
      run: |
        poetry run pytest
