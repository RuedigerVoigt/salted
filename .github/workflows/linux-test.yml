# This workflow will install Python dependencies and run tests with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Linux Test

on: [push, pull_request]

# Least privilege: read-only token, no write access, and no secrets are
# referenced. Publishing/write access lives only in release.yml.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # Deliberately test the oldest version, the latest stable one, the
        # upcoming one, and one in between. Intermediate releases (3.12) are
        # skipped on purpose to keep CI fast — salted is pure-Python with no
        # version-specific code paths, so boundary coverage is sufficient.
        # (Windows/macOS workflows narrow this further.) 3.15 is a regular
        # entry: a failure there fails CI like any other version.
        python-version: ['3.11', '3.13', '3.14', '3.15']

    steps:
    - name: APT Update
      run: sudo apt update

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry

    - name: Install dependencies
      run: |
        poetry install --with test

    - name: Compile to bytecode
      run: python -m compileall salted/

    - name: Test with pytest
      run: |
        poetry run pytest
