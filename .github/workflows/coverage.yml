name: Coverage Check

on: [push, pull_request]

# Least privilege: read-only token, no write access, and no secrets are
# referenced. Publishing/write access lives only in release.yml.
permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 3.14
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install -r .github/requirements/poetry.txt

    - name: Install dependencies
      run: poetry install --with test

    - name: Run tests with coverage check (minimum 95%)
      run: poetry run pytest --cov=salted --cov-fail-under=95 tests/
