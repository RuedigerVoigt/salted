# This is an example config file for the salted linkchecker
# https://github.com/RuedigerVoigt/salted/
# String arguments do not need quotes around them. Every key is optional.
# All settings are described in documentation/use-a-config-file.md

[FILES]
searchpath = .
# file_types: supported, html, tex (includes BibTeX) or markdown
file_types = supported
# exclude_paths: comma-separated files and folders that are not scanned,
# absolute or relative to the working directory (not to searchpath).
# exclude_paths = site/vendor, site/drafts/wip.html

[BEHAVIOR]
num_workers = 12
timeout = 5
raise_for_dead_links = False
# user_agent: Use a preset (chrome, firefox, edge, safari, chrome-mac, chrome-linux) or custom string (default: salted)
# user_agent = chrome
domain_delay = 0.25
ignore_urls =
# ignore_domains: comma-separated host names whose URLs are not checked.
# Matching is exact: example.com does not match sub.example.com.
ignore_domains =
# check_internal_links: check relative links and #fragments in HTML files
# against the filesystem
check_internal_links = True
# max_file_size_mb: larger files are skipped and reported as unreadable
max_file_size_mb = 20

[CACHE]
cache_file = salted-cache.sqlite3
dont_check_again_within_hours = 24

[TEMPLATE]
template_searchpath = salted/templates
template_name = default.cli.jinja
write_to = cli
# base_url (optional): replace the checked folder's filesystem path with this
# URL in report output. Leave unset to show paths relative to the checked
# folder. Do NOT set it to the word "None" — that is treated as unset.
# base_url = https://www.example.com
