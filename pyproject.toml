[project]
name = "salted"
version = "2.0.0"
description = "Fast async link checker for HTML, Markdown, TeX, and BibTeX files. Detects broken hyperlinks, validates DOIs, and uses a local cache to avoid rechecking. Runs as CLI or in CI/CD pipelines on Windows, Linux, and Mac."
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Rüdiger Voigt", email = "projects@ruediger-voigt.eu"}
]
keywords = ["link-checker", "url-validation", "html", "markdown", "latex", "bibtex", "async", "dead-links", "broken-links"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Internet :: WWW/HTTP :: Site Management :: Link Checking"
]
requires-python = ">=3.11,<4"
dependencies = [
    "aiodns>=4.0.4",  # not imported directly; aiohttp uses it for async DNS
    "aiohttp>=3.14.1",
    "beautifulsoup4>=4.15.0",
    "compatibility>=2.2.0",
    "jinja2>=3.1.6",
    "pybtex>=0.26.1",
    "tqdm>=4.69.0",
    "userprovided>=2.6.0",
]

[project.optional-dependencies]
lxml = ["lxml>=6.1.1"]

[project.urls]
Homepage = "https://github.com/RuedigerVoigt/salted"
Repository = "https://github.com/RuedigerVoigt/salted"
"Bug Tracker" = "https://github.com/RuedigerVoigt/salted/issues"
Changelog = "https://github.com/RuedigerVoigt/salted/blob/main/CHANGELOG.md"

[project.scripts]
salted = "salted.command_line:main"

[tool.poetry]
packages = [{include = "salted"}]
include = ["salted/py.typed", "salted/templates/*.jinja"]

[tool.poetry.group.test.dependencies]
pytest = ">=9.1.1"
pytest-asyncio = ">=1.4.0"
pytest-mock = ">=3.15.1"
pyfakefs = ">=6.2.0"
pytest-cov = "*"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1"
pytest-asyncio = ">=1.4.0"
pytest-mock = ">=3.15.1"
pyfakefs = ">=6.2.0"
pytest-cov = "*"
ruff = ">=0.16.0"
mypy = ">=2.3.0"
bandit = ">=1.9.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
console_output_style = "classic"
python_files = "test_*.py"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
branch = true
source = ["salted"]

[tool.coverage.html]
title = "Coverage Report for the salted Python Package"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, C90: mccabe complexity (mirrors the
# previous flake8 configuration). UP: pyupgrade, B: flake8-bugbear,
# I: isort, ASYNC: flake8-async, RUF: ruff-native rules.
select = ["E", "W", "F", "C90", "UP", "B", "I", "ASYNC", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10
