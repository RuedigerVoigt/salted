[tool.poetry]
name = "salted"
version = "2.0.0"
description = "Fast async link checker for HTML, Markdown, TeX, and BibTeX files. Detects broken hyperlinks, validates DOIs, and uses a local cache to avoid rechecking. Runs as CLI or in CI/CD pipelines on Windows, Linux, and Mac."
authors = ["Rüdiger Voigt <projects@ruediger-voigt.eu>"]
license = "Apache-2.0"
readme = "README.md"
keywords = ["link-checker", "url-validation", "html", "markdown", "latex", "bibtex", "async", "dead-links", "broken-links"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Internet :: WWW/HTTP :: Site Management :: Link Checking"
]
packages = [{include = "salted"}]
include = ["salted/py.typed", "salted/templates/*.jinja"]

[tool.poetry.urls]
Homepage = "https://github.com/RuedigerVoigt/salted"
Repository = "https://github.com/RuedigerVoigt/salted"
"Bug Tracker" = "https://github.com/RuedigerVoigt/salted/issues"
Changelog = "https://github.com/RuedigerVoigt/salted/blob/main/CHANGELOG.md"

[tool.poetry.dependencies]
python = "^3.10"
aiodns = ">=4.0.0"  # not imported directly; aiohttp uses it automatically for faster async DNS resolution
aiohttp = ">=3.13.5"
beautifulsoup4 = ">=4.14.3"
compatibility = ">=2.0.0"
jinja2 = ">=3.1.6"
lxml = {version = ">=6.0.4", optional = true}
pybtex = ">=0.26.1"
tqdm = ">=4.67.3"
userprovided = ">=2.3.0"

[tool.poetry.extras]
lxml = ["lxml"]

[tool.poetry.group.test.dependencies]
pytest = ">=9.0.3"
pytest-asyncio = ">=1.1.0"
pytest-mock = ">=3.15.1"
pyfakefs = ">=6.2.0"
pytest-cov = "*"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
pytest-asyncio = ">=1.1.0"
pytest-mock = ">=3.15.1"
pyfakefs = ">=6.2.0"
pytest-cov = "*"
flake8 = ">=7.3.0"
mypy = ">=1.20.2"
bandit = ">=1.9.4"

[tool.poetry.scripts]
salted = "salted.command_line:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
console_output_style = "classic"
python_files = "test_*.py"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
branch = true
source = ["salted"]

[tool.coverage.html]
title = "Coverage Report for the salted Python Package"
