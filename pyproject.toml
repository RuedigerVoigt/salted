[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salted"
dynamic = ["version"]
authors = [
    {name = "Rüdiger Voigt", email = "projects@ruediger-voigt.eu"}
]
description = "Smart, Asynchronous Link Tester with Database backend"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Internet :: WWW/HTTP :: Site Management :: Link Checking"
]
dependencies = [
    "aiodns>=3.0.0",
    "aiohttp>=3.8.5",
    "beautifulsoup4>=4.12.2",
    "compatibility>=1.0.1",
    "jinja2>=3.1.1",
    "lxml>=4.9.2",
    "pybtex>=0.24.0",
    "sqlalchemy>=1.4.35",
    "tqdm>=4.62.3",
    "userprovided>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/RuedigerVoigt/salted"

[project.scripts]
salted = "salted.command_line:main"

[tool.setuptools.dynamic]
version = {attr = "salted._version.__version__"}

[tool.setuptools.package-data]
salted = ["py.typed", "templates/*.jinja"]

[tool.pytest.ini_options]
console_output_style = "classic"
python_files = "test_*.py"
testpaths = ["tests"]
addopts = "-v --tb=short"